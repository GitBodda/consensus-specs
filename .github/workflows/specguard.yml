name: SpecGuard
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  specguard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout SpecGuard-LLM tool
        uses: actions/checkout@v4
        with:
          repository: GitBodda/SpecGuard-LLM
          ref: main
          path: SpecGuard-LLM

      - name: Checkout Lighthouse client (for mapping)
        uses: actions/checkout@v4
        with:
          repository: sigp/lighthouse
          ref: stable
          path: lighthouse

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fix SpecGuard cli.py indentation
        run: |
          cat > /tmp/fix_cli.py << 'PYEOF'
          import re
          with open('./SpecGuard-LLM/src/specguard/cli.py', 'r') as f:
              content = f.read()
