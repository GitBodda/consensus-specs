name: SpecGuard
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  specguard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout SpecGuard-LLM tool
        uses: actions/checkout@v4
        with:
          repository: GitBodda/SpecGuard-LLM
          ref: main
          path: SpecGuard-LLM

      - name: Checkout Lighthouse client (for mapping)
        uses: actions/checkout@v4
        with:
          repository: sigp/lighthouse
          ref: stable
          path: lighthouse

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fix SpecGuard cli.py indentation
        run: |
          cd SpecGuard-LLM/src/specguard
          # Download the fixed cli.py from a gist or write it inline
          cat > cli.py << 'CLIPY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          from typing import Optional, List

          import click
          from rich.console import Console
          from rich.table import Table

          from .analyze import analyze_repo
          from .config import load_config
          from .models import Report
          from .reporting import summarize_report_md
          from .utils import load_json, load_text

          console = Console()


          def _normalize_fail_on(v: str) -> str:
              v = v.strip().lower()
              if v in ("high", "h"):
                  return "HIGH"
              if v in ("medium", "med", "m"):
                  return "MEDIUM"
              if v in ("low", "l"):
                  return "LOW"
              raise click.BadParameter("fail-on must be one of: low|medium|high")


          def _exit_code(report: Report, fail_on: str) -> int:
              order = {"LOW": 1, "MEDIUM": 2, "HIGH": 3}
              threshold = order[fail_on]
              worst = max([order.get(f.severity, 1) for f in report.findings], default=1)
              return 2 if worst >= threshold else 0


          @click.group()
          def main() -> None:
              """SpecGuard: LLM-assisted spec drift & compliance checker for Ethereum specs/clients."""
              pass


          @main.command()
          @click.option("--repo", required=True, type=click.Path(exists=True, file_okay=False))
          @click.option("--base", required=True, help="Base git ref/SHA.")
          @click.option("--head", required=True, help="Head git ref/SHA.")
          @click.option("--out", "out_path", required=True, type=click.Path(dir_okay=False))
          @click.option("--repo-slug", default=None)
          @click.option("--config", "config_path", default=None)
          @click.option("--map-repo", default=None)
          @click.option("--search-backend", default="auto", type=click.Choice(["auto","rg","git_grep"]))
          @click.option("--max-keyword-hits", default=40, type=int)
          @click.option("--no-prefer-tests", is_flag=True)
          @click.option("--max-findings", default=200, type=int)
          @click.option("--deterministic", is_flag=True)
          @click.option("--cache-dir", default=None, type=click.Path(file_okay=False))
          @click.option("--extra-redact", multiple=True)
          def analyze(
              repo: str,
              base: str,
              head: str,
              out_path: str,
              repo_slug: Optional[str],
              config_path: Optional[str],
              map_repo: Optional[str],
              search_backend: str,
              max_keyword_hits: int,
              no_prefer_tests: bool,
              max_findings: int,
              deterministic: bool,
              cache_dir: Optional[str],
              extra_redact: List[str],
          ) -> None:
              """Analyze base..head diffs and output JSON report."""
              cfg = load_config(config_path)
              effective_repo_slug = repo_slug or cfg.repo_slug
              effective_map_repo = map_repo or cfg.map_repo

              report = analyze_repo(
                  repo=repo,
                  base=base,
                  head=head,
                  out_path=Path(out_path),
                  deterministic=deterministic,
                  cache_dir=(Path(cache_dir) if cache_dir else None),
                  repo_slug=effective_repo_slug,
                  map_repo=effective_map_repo,
                  search_backend=search_backend or cfg.search_backend,
                  max_keyword_hits=max_keyword_hits or cfg.max_keyword_hits,
                  prefer_tests=(not no_prefer_tests) and cfg.prefer_tests,
                  max_findings=max_findings or cfg.max_findings,
                  schema_path=Path(__file__).resolve().parents[3] / "schemas" / "report.schema.json",
              )
              md = summarize_report_md(report)
              console.print(md)

              code = _exit_code(report, "HIGH")
              if code != 0:
                  raise SystemExit(code)
          CLIPY
          # Remove leading spaces from heredoc
          sed -i 's/^          //' cli.py
          python -m py_compile cli.py
          echo "cli.py fixed and validated"

      - name: Install SpecGuard from source
        run: |
          pip install -e ./SpecGuard-LLM
          # Copy prompts and schemas to working directory
          cp -r ./SpecGuard-LLM/prompts ./prompts
          cp -r ./SpecGuard-LLM/schemas ./schemas

      - name: Run SpecGuard with Gemini
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_GUARD_LLM_PROVIDER: openai
          SPEC_GUARD_OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPEC_GUARD_OPENAI_MODEL: gemini-2.0-flash
          SPEC_GUARD_OPENAI_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
        run: |
          specguard analyze \
            --repo . \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --repo-slug "${{ github.repository }}" \
            --map-repo ./lighthouse \
            --out specguard.json
          cat specguard.json

      - uses: actions/upload-artifact@v4
        with:
          name: specguard-report
          path: specguard.json
